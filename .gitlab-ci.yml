image: node:22-alpine

stages:
  - test
  - deploy

cache:
  key:
    files:
      - package.json
  paths:
    - .npm/

test:
  stage: test
  before_script:
    - npm install --cache .npm --prefer-offline
  script:
    - npm test

pages:
  stage: deploy
  before_script:
    - npm install --cache .npm --prefer-offline
  script:
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
